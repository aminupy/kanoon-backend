[project]
name = "kanoon-backend"
version = "0.1.0"
description = "Multi-tenant educational institute backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.19.0",
  "argon2-cffi==25.1.0",
  "boto3==1.43.66",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "psycopg[binary,pool]==3.3.4",
  "pyjwt[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "pydantic-settings==2.14.2",
  "sqlalchemy[asyncio]==2.0.51",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
  "testcontainers[postgres]==4.15.0",
  "types-boto3[s3]==1.43.66",
  "types-jsonschema==4.26.0.20260518",
]

[project.scripts]
kanoon = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "T20", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]
"migrations/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "testcontainers.*"]
ignore_missing_imports = true
