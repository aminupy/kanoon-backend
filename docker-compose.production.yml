name: kanoon-production

x-application: &application
  image: ${KANOON_IMAGE:?set KANOON_IMAGE to an immutable image tag or digest}
  pull_policy: always
  env_file:
    - ${KANOON_APP_ENV_FILE:-.env.production.app}
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    # PostgreSQL patch upgrades are deliberate infrastructure changes, not a side
    # effect of an application deploy. This digest currently resolves from 18-alpine.
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      KANOON_DB_APP_USER: ${KANOON_DB_APP_USER:?set KANOON_DB_APP_USER}
      KANOON_DB_APP_PASSWORD: ${KANOON_DB_APP_PASSWORD:?set KANOON_DB_APP_PASSWORD}
    volumes:
      # PostgreSQL 18 stores PGDATA below /var/lib/postgresql/18/docker. Mount the
      # parent directory as required by the official image; do not reuse a PG17 volume.
      - postgres-18-data:/var/lib/postgresql
      - ./deploy/postgres/init/00-kanoon-roles.sh:/docker-entrypoint-initdb.d/00-kanoon-roles.sh:ro
    shm_size: 256mb
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - database

  migrate:
    <<: *application
    command:
      - alembic
      - upgrade
      - head
    environment:
      # Alembic alone receives the migration-owner DSN. Runtime processes use the
      # restricted DSN from KANOON_APP_ENV_FILE and SET LOCAL ROLE kanoon_app.
      KANOON_DATABASE_DSN: ${KANOON_MIGRATION_DATABASE_DSN:?set owner migration DSN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - database

  backend:
    <<: *application
    restart: unless-stopped
    environment:
      KANOON_DATA_PLANE_HOST: 0.0.0.0
      KANOON_DATA_PLANE_PORT: "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # The host reverse proxy is the only intended caller. Do not publish this
      # as 0.0.0.0:8000 unless an external firewall/proxy design explicitly requires it.
      - 127.0.0.1:${KANOON_DATA_PLANE_PORT:-8000}:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/ready',
          timeout=3
          )
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - database
      - edge

  backend-control-plane:
    <<: *application
    command:
      - kanoon
      - serve-control-plane
    restart: unless-stopped
    environment:
      KANOON_CONTROL_PLANE_HOST: 0.0.0.0
      KANOON_CONTROL_PLANE_PORT: "8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${KANOON_CONTROL_PLANE_PORT:-8001}:8001
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8001/health/ready',
          timeout=3
          )
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - database

  site-build-worker:
    <<: *application
    command:
      - kanoon
      - site-build-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - edge

volumes:
  postgres-18-data:

networks:
  # No host port is published for PostgreSQL, and this network has no external route.
  database:
    internal: true
  # Backend and build worker use this network for S3, payment, OTP, and build webhooks.
  edge:
